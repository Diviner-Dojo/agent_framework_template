# Education Gate Registry
#
# Tracks education gates (Principle #6: walkthrough -> quiz -> explain-back -> merge)
# that were DEFERRED at review/merge time and are still awaiting closure.
#
# Managed by scripts/education/gate_registry.py. Prefer the CLI over hand-editing:
#   python scripts/education/gate_registry.py list [--status open]
#   python scripts/education/gate_registry.py backlog
#   python scripts/education/gate_registry.py clear --gate-id <id> --session-id <s> --discussion-id <d>
#
# `backlog` is the read-only, age-bucketed rendering that .claude/hooks/session-start.ps1
# prints in its PROCESS HEALTH block. It is INFORMATIONAL: an open gate fails nothing.
# That hook does not run on every session: which SessionStart events run it is set by the
# matcher in .claude/settings.json (measured 2026-08-09: `resume|compact`, so the nudge
# appeared on resume/compaction but not on a fresh session -- check the file, not the date).
#
# A gate is CLOSED by doing the education (/walkthrough then /quiz on its scope). `clear`
# only RECORDS that such a session happened -- it validates neither --session-id nor
# --discussion-id against any store, so clearing without the session writes a registry
# that reports zero education debt with zero education having occurred.
#
# This comment header survives the CLI. `save_registry` re-emits the leading comment block
# verbatim, because yaml.safe_dump cannot round-trip comments; without that the first
# `clear` deleted every line above `version:`. Reproduced 2026-08-09 against commit 31bfe09
# on scratch copies (never this file): that commit's 16-line header went to 0. The
# reproduction command is in read_header's docstring in gate_registry.py.
#
# Seeded 2026-07-14 from real deferral archaeology (Phase 0 Task A of
# SPEC-20260714-220401-repocademy). Every gate below is evidenced by a REV report
# §Education Gate section or a delivered-but-unclosed walkthrough doc. Units 3.1 and
# 3.2 of the telemetry cohort were deliberately OMITTED: 3.1's REV (REV-20260609-052616)
# carries no Education Gate section and 3.2's REV (REV-20260609-060229) explicitly
# records the gate as "Not needed" (waived as redundant with the Unit 1 walkthrough the
# developer worked through in session 18) -- neither is an open deferral.
